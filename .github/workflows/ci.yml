name: CI
on:
  - push
  - pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Fix Electron sandbox permissions
        run: |
          sudo chown root:root /home/runner/work/electron-stream/electron-stream/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 /home/runner/work/electron-stream/electron-stream/node_modules/electron/dist/chrome-sandbox

      - run: xvfb-run npm test
